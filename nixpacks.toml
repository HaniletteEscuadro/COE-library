# Nixpacks build configuration.
#
# Only the install phase is overridden. Everything else — the Node version (from
# .nvmrc), the build command and the start command — stays as Nixpacks and
# package.json already define it.
#
# WHY NOT `npm ci`
# ----------------
# Nixpacks defaults to `npm ci`, and on Railway that fails:
#
#     npm error EBUSY: resource busy or locked, rmdir '/app/node_modules/.cache'
#
# `npm ci` deletes node_modules entirely before installing, which is the point
# of it. Railway mounts a build cache at `/app/node_modules/.cache` to make
# repeat builds faster, and a mount point cannot be removed by the process it is
# mounted into — so the delete fails and the build dies before installing
# anything.
#
# `npm install` installs into the existing directory instead of clearing it
# first, so the mount is left alone.
#
# WHAT IS GIVEN UP
# ----------------
# `npm ci` guarantees the installed tree matches package-lock.json exactly and
# fails if the lockfile is out of date. `npm install` will quietly update the
# lockfile if package.json disagrees with it.
#
# That matters less here than it sounds: package-lock.json is committed, and
# `npm install` still resolves from it when the two agree — which they do,
# because the lockfile is regenerated by the same `npm install` locally. The
# thing to watch is that a dependency change must be committed *with* its
# lockfile change, or the deployed tree can differ from the local one.
#
# If Railway ever stops mounting that cache, this file can go and the default
# `npm ci` returns.

[phases.install]
cmds = ["npm install --no-audit --no-fund"]
